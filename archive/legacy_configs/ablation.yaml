# 消融实验配置 (与论文表5对应)
# 基于 default.yaml 覆盖特定字段

# 实验1: 完整模型 (Full Model)
full_model:
  engram:
    enabled: true
  mhc:
    enabled: true
  optimizer:
    name: "adamw"  # 当前最佳

# 实验2: 移除Engram (-Engram)
no_engram:
  engram:
    enabled: false

# 实验3: 移除MHC (-MHC)
no_mhc:
  mhc:
    enabled: false

# 实验4: AdamW替代Muon (AdamW)
# 注：当前默认已是AdamW，此实验保留用于对比
adamw:
  optimizer:
    name: "adamw"
    lr_attn: 1.0e-4
    lr_ffn: 3.0e-4

# 实验5: 移除Engram+MHC (-Engram-MHC)
no_engram_mhc:
  engram:
    enabled: false
  mhc:
    enabled: false

# 实验6: 纯Transformer Baseline (Baseline)
baseline:
  engram:
    enabled: false
  mhc:
    enabled: false
  optimizer:
    name: "adamw"

# 实验7: Engram K=3
engram_k3:
  engram:
    top_k: 3

# 实验8: Engram K=10
engram_k10:
  engram:
    top_k: 10
