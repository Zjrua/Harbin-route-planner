[project]
name = "harbin-route-planner"
version = "0.2.0"
description = "基于 Qwen3.5-4B 微调的哈尔滨旅游路线生成系统（自然语言指令 → 逐日 POI 路线）"
requires-python = ">=3.10"
dependencies = [
    "numpy>=1.24.0",
    "pandas>=2.0.0",
    "scikit-learn>=1.3.0",
    "pyyaml>=6.0",
    "requests>=2.31.0",
    "folium>=0.15.0",
    "matplotlib>=3.7.0",
    "tqdm>=4.65.0",
    # Qwen 微调与推理
    "torch>=2.4.0",
    "transformers>=5.0.0",
    "trl>=1.9.0",
    "peft>=0.13.0",
    "datasets>=3.0.0",
    "accelerate>=1.0.0",
    "bitsandbytes>=0.44.0",
]

[dependency-groups]
dev = [
    "pytest>=7.4.0",
    "ruff>=0.1.0",
]

[tool.pytest.ini_options]
pythonpath = ["."]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.uv]
find-links = ["https://download.pytorch.org/whl/cu128"]
