[project]
name = "harbin-route-planner"
version = "0.3.0"
description = "基于 Qwen3.5-4B 微调的哈尔滨旅游路线生成系统（自然语言指令 → 逐日 POI 路线）"
requires-python = ">=3.10,<3.13"
dependencies = [
    # 核心框架（Qwen 微调与推理）
    "torch>=2.5",
    "transformers>=5.0.0",
    "trl>=1.9.0",
    "peft>=0.13.0",
    "datasets>=3.0.0",
    "accelerate>=1.0.0",
    "bitsandbytes>=0.44.0",
    # 数据与可视化
    "numpy>=1.24.0",
    "pandas>=2.0.0",
    "folium>=0.15.0",
    "matplotlib>=3.7.0",
    "requests>=2.31.0",
    "scikit-learn>=1.3.0",
    "pyyaml>=6.0",
    "tqdm>=4.65.0",
]

# ============================================================
# 跨平台 PyTorch 安装（uv）
#
# 为什么不需要多个 uv.lock.* 文件：
#   uv.lock 是 universal lockfile，跨平台共享时自动按 marker 选 wheel。
#   真正的难点只有 torch 的 CUDA wheel 不在 PyPI 上。
#
# 平台矩阵：
#   - macOS (Apple Silicon)   torch 走 PyPI 官方包，自带 MPS 后端 → 无需特殊配置
#   - Windows + Intel Arc     torch 走 PyPI CPU 包（≥2.5 内置 XPU 运行时）→ 无需特殊配置
#   - Windows + NVIDIA CUDA   需额外 index → uv sync --index pytorch-cu128
#
# 使用：
#   - 通用（Mac / Windows CPU+XPU）：uv sync
#   - NVIDIA CUDA（Windows）：uv sync --index pytorch-cu128
#   - 自动探测硬件：scripts/install_env.ps1（Windows）/ scripts/install_env.sh（Mac）
# ============================================================
[[tool.uv.index]]
name = "pytorch-cu128"
url = "https://download.pytorch.org/whl/cu128"
explicit = true

[dependency-groups]
dev = [
    "pytest>=7.4.0",
    "ruff>=0.1.0",
]

[tool.pytest.ini_options]
pythonpath = ["."]

[tool.ruff]
line-length = 100
target-version = "py310"
