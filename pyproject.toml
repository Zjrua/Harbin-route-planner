[project]
name = "harbin-route-planner"
version = "0.3.0"
description = "基于 Qwen3.5-4B 微调的哈尔滨旅游路线生成系统（自然语言指令 → 逐日 POI 路线）"
requires-python = ">=3.10,<3.13"
dependencies = [
    # 核心框架（Qwen 微调与推理）
    "torch>=2.5",
    "transformers>=5.0.0",
    "trl>=1.9.0",
    "peft>=0.13.0",
    "datasets>=3.0.0",
    "accelerate>=1.0.0",
    "bitsandbytes>=0.44.0",
    # 数据与可视化
    "numpy>=1.24.0",
    "pandas>=2.0.0",
    "folium>=0.15.0",
    "matplotlib>=3.7.0",
    "requests>=2.31.0",
    "scikit-learn>=1.3.0",
    "pyyaml>=6.0",
    "tqdm>=4.65.0",
    "diptest>=0.11",  # 双峰性检验(Hartigan dip)
]

# ============================================================
# 跨平台 PyTorch 安装（uv）
#
# uv.lock 是 universal lockfile，跨平台共享时自动按 marker 选 wheel。
# torch 的 CUDA wheel 不在 PyPI 上，因此用 tool.uv.sources 显式路由：
#   - Windows / Linux（NVIDIA）  torch 走 download.pytorch.org 的 cu128 索引
#   - macOS（Apple Silicon）     torch 走 PyPI 官方包，自带 MPS 后端
#     （上面 win32/linux 的 sources 映射带 marker，darwin 不命中，回落 PyPI）
#
# 使用（三平台统一，无需任何额外 flag）：
#   uv sync
#
# Mac MPS 训练注意事项（Apple Silicon, macOS >= 14）：
#   1. PyPI 的 torch arm64 wheel 已内置 MPS 后端，`uv sync` 即得；
#   2. bitsandbytes >= 0.45 提供 Metal 后端（0.50.1 有 macosx_14_0_arm64
#      wheel），NF4 4-bit 推理/QLoRA 在 Metal 上为实验性支持，若遇
#      未实现算子报错，可改用 bf16/fp16 非量化加载（4B 模型 ≈ 8GB 显存，
#      16GB 统一内存的 Mac 可承受）；
#   3. 建议在 shell 里 export PYTORCH_ENABLE_MPS_FALLBACK=1，
#      缺失算子自动回退 CPU 而非直接报错；
#   4. bf16 训练需 torch>=2.3 且 macOS>=14，本项目 torch>=2.5 已满足。
# ============================================================
[[tool.uv.index]]
name = "pytorch-cu128"
url = "https://download.pytorch.org/whl/cu128"
explicit = true

[tool.uv.sources]
# CUDA wheel 只在 Windows/Linux 生效；macOS 走 PyPI（含 MPS），不命中此映射
torch = [
    { index = "pytorch-cu128", marker = "sys_platform == 'win32' or sys_platform == 'linux'" },
]

[dependency-groups]
dev = [
    "pytest>=7.4.0",
    "ruff>=0.1.0",
]

[tool.pytest.ini_options]
pythonpath = ["."]

[tool.ruff]
line-length = 100
target-version = "py310"
